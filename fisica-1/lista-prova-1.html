            --accent-cyan: #38bdf8;
            --accent-gold: #fbbf24;
            --accent-emerald: #10b981;
            --text-main: #f8fafc;
            --text-sub: #cbd5e1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-size: 0.98rem;
            line-height: 1.65;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 90% 90%, rgba(168, 85, 247, 0.15) 0%, transparent 45%);
            background-attachment: fixed;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            background: rgba(10, 16, 30, 0.85);
            border: 1px solid var(--bg-card-border);
            padding: 16px 22px;
            border-radius: 14px;
        }
        .back-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--bg-card-border);
            color: var(--accent-cyan);
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.88rem;
            transition: all 0.2s;
        }
        .back-btn:hover { background: rgba(56, 189, 248, 0.2); border-color: var(--accent-cyan); }

        .pdf-btn {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 800;
            font-size: 0.90rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.3);
            transition: all 0.2s;
        }
        .pdf-btn:hover { opacity: 0.92; transform: translateY(-1px); }

        .search-filter-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            padding: 14px;
            border-radius: 12px;
            align-items: center;
        }
        .search-input {
            flex: 1;
            min-width: 250px;
            background: #050811;
            border: 1px solid #334155;
            color: white;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }
        .search-input:focus { border-color: var(--accent-cyan); }

        .filter-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: var(--text-sub);
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn.active {
            background: var(--primary-gradient);
            color: white;
            border-color: transparent;
        }

        .question-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 18px;
        }

        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }
        .q-badge {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-cyan);
            border: 1px solid rgba(56, 189, 248, 0.4);
            font-weight: 800;
            font-size: 0.95rem;
            padding: 4px 12px;
            border-radius: 6px;
        }
        .q-text {
            font-size: 1.0rem;
            color: #e2e8f0;
            line-height: 1.7;
            margin-bottom: 14px;
        }

        .btn-voice {
            background: #a855f7;
            color: white;
            border: none;
            font-weight: 700;
            font-size: 0.82rem;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-voice:hover { opacity: 0.9; }

        @media print {
            body { background: white; color: black; }
            .top-header, .search-filter-bar, .btn-voice { display: none !important; }
            .question-card { border: 1px solid #ccc; background: white; color: black; page-break-inside: avoid; }
            .q-badge { color: #000; border-color: #000; }
        }
    </style>

        let currentFilter = 'all';

        function renderQuestions() {
            const listEl = document.getElementById('questions-list');
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            listEl.innerHTML = '';

            const filtered = questionsData.filter(q => {
                const matchCap = (currentFilter === 'all' || q.cap === currentFilter);
                const matchText = q.ex.toLowerCase().includes(searchVal) || q.text.toLowerCase().includes(searchVal) || q.cap_title.toLowerCase().includes(searchVal);
                return matchCap && matchText;
            });

            if (filtered.length === 0) {
                listEl.innerHTML = '<div style="text-align:center; padding:40px; color:#94a3b8; font-size:1.1rem;">Nenhum exercício encontrado.</div>';
                return;
            }

            let currentCapTitle = '';

            filtered.forEach(q => {
                if (q.cap_title !== currentCapTitle) {
                    currentCapTitle = q.cap_title;
                    const headerEl = document.createElement('div');
                    headerEl.style.cssText = 'font-family:Outfit, sans-serif; font-size:1.3rem; font-weight:800; color:var(--accent-gold); margin: 24px 0 12px; border-bottom:1px solid rgba(251,191,36,0.3); padding-bottom:6px;';
                    headerEl.innerText = currentCapTitle;
                    listEl.appendChild(headerEl);
                }

                const card = document.createElement('div');
                card.className = 'question-card';
                card.innerHTML = `
                    <div class="q-header">
                        <span class="q-badge">📌 ${q.ex}</span>
                        <button class="btn-voice" onclick="readQuestion('${q.ex}')">🔊 Ouvir Exercício</button>
                    </div>
                    <div class="q-text">${q.text}</div>
                `;
                listEl.appendChild(card);
            });
        }

        function setFilter(cap, btn) {
            currentFilter = cap;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderQuestions();
        }

        function filterQuestions() { renderQuestions(); }

        function readQuestion(exId) {
            const q = questionsData.find(item => item.ex === exId);
            if (!q) return;

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const text = q.ex + '. ' + q.text;
                const ut = new SpeechSynthesisUtterance(text);
                ut.lang = 'pt-BR';
                ut.rate = 1.0;
                window.speechSynthesis.speak(ut);
            } else {
                alert('Seu navegador não suporta narração por voz.');
            }
        }

        window.onload = function() { renderQuestions(); };
    </script>
