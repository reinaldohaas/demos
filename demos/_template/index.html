<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Título da Nova Demonstração - Template</title>
    <style>
        :root {
            --bg-dark: #050812;
            --card-bg: rgba(13, 20, 36, 0.95);
            --card-border: rgba(56, 189, 248, 0.35);
            --accent-cyan: #38bdf8;
            --accent-gold: #fbbf24;
            --accent-red: #f43f5e;
            --accent-green: #34d399;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% 10%, #0c1527 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 12px 24px;
            background: rgba(10, 16, 30, 0.95);
            border-bottom: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .title-group h1 {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .title-group p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f8fafc;
            padding: 6px 14px;
            font-size: 0.8rem;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: rgba(56, 189, 248, 0.25);
            border-color: var(--accent-cyan);
        }

        .main-container {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 14px;
            padding: 14px;
            flex: 1;
            max-width: 1700px;
            margin: 0 auto;
            width: 100%;
        }

        @media (max-width: 950px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .viewport-box {
            background: #020612;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            overflow: hidden;
            position: relative;
            min-height: 480px;
            display: flex;
            flex-direction: column;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <header>
        <div class="title-group">
            <h1>Título da Simulação</h1>
            <p>Descrição breve do fenômeno físico demonstrado</p>
        </div>
        <div>
            <a href="../../index.html" class="nav-btn">🏠 Voltar ao Catálogo</a>
        </div>
    </header>

    <div class="main-container">
        <div class="panel">
            <h2 style="color:var(--accent-cyan); font-size:1rem;">⚙️ Controles</h2>
            <p style="font-size:0.8rem; color:var(--text-muted);">Adicione seus controles aqui.</p>
        </div>

        <div class="viewport-box">
            <canvas id="main-canvas"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * (window.devicePixelRatio || 1);
            canvas.height = rect.height * (window.devicePixelRatio || 1);
        }
        window.addEventListener('resize', resize);
        resize();

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Seu código de animação aqui
            requestAnimationFrame(render);
        }
        render();
    </script>
</body>
</html>
